hub:
  name: agenthub
  host: 0.0.0.0
  port: 8670
  proxy_base_port: 8671

refresh_interval_s: 20
request_timeout_s: 6
state_db: ~/.local/share/agenthub/agenthub.db

# Optional read-only MCP. Put the token in ~/.config/agenthub/env:
#   AGENTHUB_MCP_TOKEN=...
# Public clients such as ChatGPT need an additional OAuth/HTTPS entry point; see README.
# Optional skillcell audit module. It scans OpenCode sessions through the nodes
# below and stores proposals in its own SQLite file. Start with auto_scan off.
skillcell:
  enabled: false
  state_db: ~/.local/share/agenthub/skillcell.db
  skills_root: ~/.config/opencode/skill
  executor_node: local
  # Directory on the executor node used for audit sessions; create it there.
  executor_directory: ~/.local/share/skillcell/workspace
  source_nodes: [local]
  exclude: []
  auto_scan: false
  interval_s: 3600
  lookback_days: 7
  max_sessions: 10
  max_session_pages: 5
  message_limit: 50
  max_evidence: 40
  min_score: 60
  max_proposals: 5
  agent: build
  # model: deepseek/deepseek-flash
  reasoner_timeout_s: 300
  request_timeout_s: 30

mcp:
  host: 127.0.0.1
  port: 8680
  path: /mcp
  # public_url: https://sah-mcp.example.com
  auth:
    mode: bearer
    token_env: AGENTHUB_MCP_TOKEN
  # Empty means localhost / public_url are allowed automatically; extend when behind a tunnel.
  allowed_hosts: []
  allowed_origins: []
  # Expose only selected nodes or project paths; empty means everything.
  expose_nodes: []
  expose_projects: []
  max_sessions: 100
  max_projects: 200
  max_status_items: 100
  rate_limit_per_min: 60

nodes:
  - name: local
    api_url: http://127.0.0.1:4096
    web_url: http://127.0.0.1:4097
    username: opencode
    password_env: OPENCODE_SERVER_PASSWORD

  - name: node2
    api_url: http://192.0.2.10:4096
    web_url: http://192.0.2.10:4097
    username: opencode
    password_env: OPENCODE_SERVER_PASSWORD
